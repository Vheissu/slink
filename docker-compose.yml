version: '3.9'

services:
  app:
    build: .
    container_name: slink-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: slink
      DB_USERNAME: slink
      DB_PASSWORD: slink
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: slink-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:18-alpine
    container_name: slink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slink
      POSTGRES_USER: slink
      POSTGRES_PASSWORD: slink
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: slink-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  horizon:
    build: .
    container_name: slink-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis

  scheduler:
    build: .
    container_name: slink-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis

volumes:
  postgres_data:
  redis_data:
  app_storage:
