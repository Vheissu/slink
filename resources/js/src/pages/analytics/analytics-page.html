<template>
  <div class="space-y-8">
    <section class="panel">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Analytics</p>
            <h2 class="font-display text-2xl">Live performance overview</h2>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <button class="btn-chip" type="button" click.trigger="applyQuickRangeAndFetch('24h')">Last 24h</button>
            <button class="btn-chip" type="button" click.trigger="applyQuickRangeAndFetch('7d')">7d</button>
            <button class="btn-chip" type="button" click.trigger="applyQuickRangeAndFetch('30d')">30d</button>
            <button class="btn-chip" type="button" click.trigger="applyQuickRangeAndFetch('90d')">90d</button>
          </div>
        </div>

        <form class="flex flex-wrap items-center gap-3" submit.trigger="fetchStats()">
          <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Filter</label>
          <input
            class="input-field min-w-[220px]"
            placeholder="Try: url:youtube title:\"creator\""
            value.bind="queryInput"
          />
          <input class="input-field" type="date" value.bind="fromDate" />
          <input class="input-field" type="date" value.bind="toDate" />
          <label class="flex items-center gap-2 text-xs text-slink-muted">
            <input type="checkbox" checked.bind="includeBots" />
            Include bots
          </label>
          <button class="btn-outline" type="submit" disabled.bind="isLoading">Apply</button>
          <button class="btn-chip" type="button" click.trigger="clearQuery()" if.bind="queryInput">
            Clear
          </button>
          <button class="btn-chip" type="button" click.trigger="exportCsv()" if.bind="stats">
            Export CSV
          </button>
          <button class="btn-chip" type="button" click.trigger="exportPdf()" if.bind="stats">
            Export PDF
          </button>
        </form>

        <p class="text-xs text-slink-muted">
          Operators: <span class="font-mono">url:</span>, <span class="font-mono">slug:</span>,
          <span class="font-mono">title:</span>, <span class="font-mono">contains:</span>.
        </p>
        <p class="text-sm text-slink-muted" if.bind="scope">
          ${scope.mode === 'global' ? 'Showing all link analytics.' : `Filtered by: ${scope.query}`}
          <span if.bind="scope.mode !== 'global'"> · ${scope.matched_links} links matched</span>
        </p>
      </div>

      <p class="mt-4 text-sm text-slink-muted" if.bind="isLoading">Loading...</p>
      <p class="mt-4 text-sm text-slink-muted" if.bind="error">${error}</p>

      <div class="mt-6" if.bind="series.length">
        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Trend</p>
          <div class="chart-shell">
            <canvas ref="chartCanvas"></canvas>
          </div>
        </div>
      </div>

      <div class="mt-6 grid gap-6 lg:grid-cols-3" if.bind="stats">
        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Total clicks</p>
          <p class="mt-2 font-display text-3xl">${stats.total}</p>
        </div>
        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Top devices</p>
          <div class="mt-3 space-y-2">
            <div class="flex items-center justify-between" repeat.for="item of stats.by_device">
              <span>${item.device_type}</span>
              <span class="text-slink-muted">${item.total}</span>
            </div>
          </div>
        </div>
        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Top browsers</p>
          <div class="mt-3 space-y-2">
            <div class="flex items-center justify-between" repeat.for="item of stats.by_browser">
              <span>${item.browser}</span>
              <span class="text-slink-muted">${item.total}</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-2" if.bind="stats">
      <div class="panel">
        <h3 class="font-display text-xl">Top countries</h3>
        <div class="mt-6 space-y-3">
          <div class="flex items-center justify-between" repeat.for="item of stats.by_country">
            <span>${item.country}</span>
            <span class="text-slink-muted">${item.total}</span>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3 class="font-display text-xl">Top referrers</h3>
        <div class="mt-6 space-y-3">
          <div class="flex items-center justify-between" repeat.for="item of stats.by_referrer">
            <span>${item.referer}</span>
            <span class="text-slink-muted">${item.total}</span>
          </div>
        </div>
      </div>
    </section>

    <div class="empty-state" if.bind="!isLoading && !error && !stats">
      <p>No analytics yet. Create a link and share it to start tracking.</p>
    </div>
  </div>
</template>
