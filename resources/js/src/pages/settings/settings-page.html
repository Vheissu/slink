<template>
  <div class="space-y-8">
    <section class="panel">
      <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Settings</p>
      <h2 class="font-display text-2xl">Connect your API token</h2>
      <form class="mt-6 grid gap-4 md:grid-cols-[2fr,auto]" submit.trigger="saveToken()">
        <div class="input-shell">
          <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Bearer token</label>
          <input class="input-field" placeholder="Paste your API token" value.bind="tokenInput" />
        </div>
        <div class="flex items-end">
          <button class="btn-primary w-full" type="submit">Save</button>
        </div>
      </form>
      <p class="mt-3 text-sm text-slink-muted" if.bind="status">${status}</p>
    </section>

    <section class="panel">
      <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Governance</p>
      <h2 class="font-display text-2xl">Recent audit activity</h2>
      <p class="mt-2 text-sm text-slink-muted">Track sensitive changes made via the API.</p>

      <p class="mt-4 text-sm text-slink-muted" if.bind="isLoadingAudit">Loading audit log...</p>
      <p class="mt-4 text-sm text-rose-600" if.bind="auditError">${auditError}</p>

      <div class="mt-4 space-y-3" if.bind="!isLoadingAudit && !auditError && auditLogs.length">
        <div class="panel-sub" repeat.for="entry of auditLogs">
          <div class="flex items-center justify-between gap-4">
            <p class="text-sm font-medium">${formatAction(entry.action)}</p>
            <p class="text-xs text-slink-muted">${formatTimestamp(entry.created_at)}</p>
          </div>
          <p class="mt-2 text-xs text-slink-muted" if.bind="entry.subject_type">
            ${entry.subject_type} · ${entry.subject_id}
          </p>
        </div>
      </div>

      <p class="mt-4 text-sm text-slink-muted" if.bind="!isLoadingAudit && !auditError && !auditLogs.length">
        No activity yet. Once you start creating or updating links, entries will appear here.
      </p>
    </section>
  </div>
</template>
