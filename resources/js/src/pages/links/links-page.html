<template>
  <div class="space-y-8">
    <section class="panel">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Links</p>
          <h2 class="font-display text-2xl">Organize every destination</h2>
        </div>
        <div class="flex flex-wrap gap-3">
          <button class="btn-outline" type="button" click.trigger="triggerCsvImport()" disabled.bind="isImporting">
            ${isImporting ? 'Importing...' : 'Bulk import'}
          </button>
        </div>
      </div>
      <input
        ref="csvInput"
        class="hidden"
        type="file"
        accept=".csv,text/csv"
        change.trigger="handleCsvChange($event)"
      />
      <form class="mt-6 grid gap-4 md:grid-cols-[2fr,1fr,1fr,auto]" submit.trigger="createLink()">
        <div class="input-shell">
          <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Destination URL</label>
          <input ref="urlInput" placeholder="https://example.com" class="input-field" value.bind="newUrl" />
        </div>
        <div class="input-shell">
          <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Link name (optional)</label>
          <input placeholder="YouTube channel" class="input-field" value.bind="newTitle" />
        </div>
        <div class="input-shell">
          <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Password (optional)</label>
          <input
            class="input-field"
            type="password"
            autocomplete="new-password"
            placeholder="Protect this link"
            value.bind="newPassword"
          />
        </div>
        <div class="flex items-end">
          <button class="btn-primary w-full" type="submit" disabled.bind="isSaving">
            ${isSaving ? 'Creating...' : 'Create link'}
          </button>
        </div>
      </form>
      <p class="mt-4 text-sm text-slink-muted" if.bind="error">${error}</p>
      <p class="mt-2 text-sm text-slink-muted" if.bind="importStatus">${importStatus}</p>
      <p class="mt-2 text-sm text-rose-600" if.bind="importError">${importError}</p>
    </section>

    <section class="panel">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <h3 class="font-display text-xl">Active links</h3>
          <div class="flex items-center gap-2 text-xs text-slink-muted">
            <input type="checkbox" checked.to-view="allSelected" change.trigger="toggleSelectAll()" />
            Select all
          </div>
        </div>

        <div class="grid gap-4 lg:grid-cols-[2fr,1fr,1fr]">
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Search</label>
            <input
              class="input-field"
              placeholder="Search by title, URL, or slug"
              value.bind="searchQuery"
            />
          </div>
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Tag</label>
            <select class="input-field" value.bind="selectedTag">
              <option value="">All tags</option>
              <option repeat.for="tag of tags" model.bind="tag.id">${tag.name}</option>
            </select>
          </div>
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Status</label>
            <div class="flex flex-wrap gap-2">
              <button
                class="btn-chip"
                type="button"
                click.trigger="setStatusFilter('all')"
                data-active.bind="statusFilter === 'all'"
              >
                All
              </button>
              <button
                class="btn-chip"
                type="button"
                click.trigger="setStatusFilter('active')"
                data-active.bind="statusFilter === 'active'"
              >
                Active
              </button>
              <button
                class="btn-chip"
                type="button"
                click.trigger="setStatusFilter('inactive')"
                data-active.bind="statusFilter === 'inactive'"
              >
                Inactive
              </button>
            </div>
          </div>
        </div>

        <div class="grid gap-4 lg:grid-cols-[1fr,1fr,auto]">
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">From</label>
            <input class="input-field" type="date" value.bind="dateFrom" />
          </div>
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">To</label>
            <input class="input-field" type="date" value.bind="dateTo" />
          </div>
          <div class="flex items-end gap-2">
            <button class="btn-outline" type="button" click.trigger="applyFilters()" disabled.bind="isLoading">
              Apply
            </button>
            <button class="btn-chip" type="button" click.trigger="clearFilters()" if.bind="searchQuery || selectedTag || dateFrom || dateTo || statusFilter !== 'all'">
              Reset
            </button>
          </div>
        </div>
      </div>

      <div class="bulk-bar" if.bind="selectedCount">
        <div class="flex flex-wrap items-center gap-3">
          <p class="text-sm">${selectedCount} selected</p>
          <button class="btn-chip" type="button" click.trigger="bulkAction('activate')">Activate</button>
          <button class="btn-chip" type="button" click.trigger="bulkAction('deactivate')">Deactivate</button>
          <button class="btn-chip" type="button" click.trigger="bulkAction('delete')">Delete</button>
          <select class="input-field" value.bind="bulkTagId">
            <option value="">Select tag</option>
            <option repeat.for="tag of tags" model.bind="tag.id">${tag.name}</option>
          </select>
          <button class="btn-chip" type="button" click.trigger="bulkAction('tag')">Add tag</button>
          <button class="btn-chip" type="button" click.trigger="bulkAction('untag')">Remove tag</button>
          <button class="btn-chip" type="button" click.trigger="exportSelectedCsv()">Export CSV</button>
        </div>
        <p class="mt-2 text-sm text-slink-muted" if.bind="bulkActionStatus">${bulkActionStatus}</p>
        <p class="mt-2 text-sm text-rose-600" if.bind="bulkActionError">${bulkActionError}</p>
      </div>

      <span class="text-xs text-slink-muted" if.bind="isLoading">Loading...</span>
      <div class="mt-6 space-y-3" if.bind="!isLoading && links.length">
        <div class="link-row" repeat.for="link of links">
          <div class="flex flex-1 flex-col gap-3 lg:flex-row lg:items-center">
            <label class="flex items-start gap-3">
              <input
                type="checkbox"
                checked.to-view="selectedIds.includes(link.id)"
                change.trigger="toggleSelected(link.id)"
              />
              <div>
                <p class="font-medium">${link.title ?? 'Untitled'}</p>
                <p class="text-xs font-mono text-slink-muted">${link.original_url}</p>
                <a
                  class="text-xs font-mono text-slink-muted underline"
                  href.bind="shortUrl(link.slug)"
                  if.bind="link.slug"
                  target="_blank"
                  rel="noreferrer"
                >
                  ${shortUrl(link.slug)}
                </a>
              </div>
            </label>
            <div class="flex flex-wrap items-center gap-3 lg:ml-auto">
              <button class="btn-chip" type="button" click.trigger="copyLink(link.slug)" if.bind="link.slug">
                ${copiedSlug === link.slug ? 'Copied' : 'Copy short'}
              </button>
              <button class="btn-chip" type="button" click.trigger="copyOriginal(link.original_url)">
                ${copiedOriginal === link.original_url ? 'Copied' : 'Copy original'}
              </button>
              <button class="btn-outline" type="button" click.trigger="openDetails(link)">
                Details
              </button>
              <span class="status-pill">${link.is_active ? 'Active' : 'Inactive'}</span>
              <span class="status-pill status-pill--warning" if.bind="link.has_password">Protected</span>
              <span class.bind="healthClass(link)">${healthLabel(link)}</span>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2" if.bind="link.tags?.length">
            <span class="tag-pill" repeat.for="tag of link.tags">${tag.name}</span>
          </div>
        </div>
      </div>
      <div class="empty-state" if.bind="!isLoading && !links.length">
        <p>No links yet. Create one above.</p>
      </div>
    </section>
  </div>

  <div class="drawer" if.bind="isDrawerOpen">
    <div class="drawer-overlay" click.trigger="closeDetails()"></div>
    <div class="drawer-panel">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Link detail</p>
          <h3 class="font-display text-2xl">${activeLink?.title ?? 'Untitled'}</h3>
        </div>
        <button class="btn-chip" type="button" click.trigger="closeDetails()">Close</button>
      </div>

      <div class="mt-6 space-y-4" if.bind="activeLink">
        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Quick actions</p>
          <p class="mt-2 text-sm text-slink-muted">Total clicks: ${activeLink?.clicks_count ?? 0}</p>
          <div class="mt-3 flex flex-wrap gap-2">
            <a
              class="btn-outline"
              href.bind="shortUrl(activeLink?.slug)"
              target="_blank"
              rel="noreferrer"
            >
              Open short link
            </a>
            <button class="btn-chip" type="button" click.trigger="copyLink(activeLink?.slug)">
              Copy short
            </button>
            <button class="btn-chip" type="button" click.trigger="copyOriginal(activeLink?.original_url)">
              Copy original
            </button>
          </div>
        </div>

        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Health</p>
          <div class="mt-3 flex flex-wrap items-center gap-3">
            <span class.bind="healthClass(activeLink)">${healthLabel(activeLink)}</span>
            <span class="text-xs text-slink-muted" if.bind="activeLink?.http_status">
              HTTP ${activeLink?.http_status}
            </span>
            <span class="text-xs text-slink-muted" if.bind="activeLink?.last_checked_at">
              Checked ${activeLink?.last_checked_at}
            </span>
          </div>
          <p class="mt-2 text-xs text-rose-600" if.bind="activeLink?.last_error">${activeLink?.last_error}</p>
        </div>

        <div class="panel-sub">
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Protection</p>
          <p class="mt-2 text-sm text-slink-muted">
            ${activeLink?.has_password ? 'Password protected.' : 'No password set.'}
          </p>
          <div class="mt-4 grid gap-3">
            <div class="input-shell">
              <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">New password</label>
              <input
                class="input-field"
                type="password"
                autocomplete="new-password"
                placeholder="Leave blank to keep"
                value.bind="editPassword"
                disabled.bind="clearPassword"
              />
            </div>
            <label class="flex items-center gap-2 text-sm text-slink-muted">
              <input type="checkbox" checked.bind="clearPassword" />
              Remove password protection
            </label>
          </div>
        </div>

        <form class="space-y-4" submit.trigger="saveDetails()">
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Title</label>
            <input class="input-field" value.bind="editTitle" />
          </div>
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Destination URL</label>
            <input class="input-field" value.bind="editOriginalUrl" />
          </div>
          <div class="input-shell">
            <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Notes</label>
            <textarea class="input-field" rows="4" value.bind="editNotes"></textarea>
          </div>
          <div class="grid gap-4 md:grid-cols-2">
            <div class="input-shell">
              <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Expires at</label>
              <input class="input-field" type="date" value.bind="editExpiresAt" />
            </div>
            <div class="input-shell">
              <label class="text-xs uppercase tracking-[0.3em] text-slink-muted">Max clicks</label>
              <input class="input-field" type="number" min="1" value.bind="editMaxClicks" />
            </div>
          </div>
          <label class="flex items-center gap-2 text-sm text-slink-muted">
            <input type="checkbox" checked.bind="editIsActive" />
            Link is active
          </label>

          <div class="panel-sub">
            <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Tags</p>
            <div class="mt-3 flex flex-wrap gap-2">
              <button
                class="tag-pill"
                repeat.for="tag of tags"
                type="button"
                click.trigger="toggleTag(tag.id)"
                data-active.bind="editTagIds.includes(tag.id)"
              >
                ${tag.name}
              </button>
            </div>
            <div class="mt-4 flex flex-wrap gap-2">
              <input class="input-field" placeholder="New tag name" value.bind="newTagName" />
              <input class="input-field" type="color" value.bind="newTagColor" />
              <button class="btn-chip" type="button" click.trigger="createTag()">Add tag</button>
            </div>
          </div>

          <div class="panel-sub">
            <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">QR code</p>
            <div class="mt-3 flex flex-col gap-3">
              <img class="qr-preview" if.bind="qrDataUrl" src.bind="qrDataUrl" alt="QR code" />
              <button class="btn-chip" type="button" click.trigger="downloadQr()" if.bind="qrDataUrl">
                Download QR
              </button>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <button class="btn-primary" type="submit" disabled.bind="isSavingDetails">
              ${isSavingDetails ? 'Saving...' : 'Save changes'}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>
