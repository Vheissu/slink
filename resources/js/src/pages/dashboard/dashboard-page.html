<template>
  <div class="space-y-8">
    <section class="grid gap-4 md:grid-cols-3">
      <div class="metric-card" repeat.for="metric of metrics">
        <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">${metric.label}</p>
        <div class="mt-3 flex items-end justify-between">
          <p class="font-display text-3xl">${metric.value}</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-slink-muted">Live links</p>
          <h2 class="font-display text-2xl">Recent destinations</h2>
        </div>
        <span class="text-xs text-slink-muted" if.bind="isLoading">Loading...</span>
      </div>

      <div class="mt-6 space-y-4" if.bind="error">
        <div class="status-pill status-pill--error">${error}</div>
      </div>

      <div class="mt-6 space-y-4" if.bind="!isLoading && !error && recentLinks.length">
        <div class="link-row" repeat.for="link of recentLinks">
          <div>
            <p class="font-medium">${link.title ?? 'Untitled'}</p>
            <p class="text-xs font-mono text-slink-muted">${link.original_url}</p>
            <a
              class="text-xs font-mono text-slink-muted underline"
              href.bind="shortUrl(link.slug)"
              if.bind="link.slug"
              target="_blank"
              rel="noreferrer"
            >
              ${shortUrl(link.slug)}
            </a>
          </div>
          <div class="flex items-center gap-6">
            <button
              class="btn-chip"
              type="button"
              click.trigger="copyLink(link.slug)"
              if.bind="link.slug"
            >
              ${copiedSlug === link.slug ? 'Copied' : 'Copy'}
            </button>
            <span class="status-pill">${link.is_active ? 'Active' : 'Inactive'}</span>
          </div>
        </div>
      </div>

      <div class="empty-state" if.bind="!isLoading && !error && !recentLinks.length">
        <p>No links yet. Create your first short link to see activity here.</p>
      </div>
    </section>
  </div>
</template>
