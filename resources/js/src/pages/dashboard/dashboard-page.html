<div class="page-stack">
  <header class="page-heading">
    <div>
      <h1>Dashboard</h1>
      <p class="page-description">A quick read on your links and clicks.</p>
    </div>
  </header>

  <section class="setup-state" if.bind="!hasToken">
    <div>
      <h2>Connect this Slink server</h2>
      <p>Add a bearer token before loading links or analytics.</p>
      <a class="btn-primary" href="/settings" load="../settings">Open settings</a>
    </div>
  </section>

  <template if.bind="hasToken">
    <section class="metric-grid" aria-label="Link totals" aria-busy.bind="isLoading">
      <template if.bind="isLoading">
        <div class="metric-card" repeat.for="item of [1, 2, 3, 4]">
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-value"></div>
        </div>
      </template>
      <template if.bind="!isLoading">
        <article class="metric-card" repeat.for="metric of metrics">
          <p class="metric-label">${metric.label}</p>
          <p class="metric-value">${metric.value}</p>
          <p class="metric-help">${metric.help}</p>
        </article>
      </template>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">Recent links</h2>
          <p class="panel-copy">The four most recently created destinations.</p>
        </div>
        <a class="btn-secondary" href="/links" load="../links">View all links</a>
      </div>

      <div class="notice notice--error" role="alert" if.bind="error">${error}</div>

      <div class="recent-list" if.bind="isLoading" aria-hidden="true">
        <div class="skeleton-row" repeat.for="item of [1, 2, 3, 4]"></div>
      </div>

      <div class="recent-list" if.bind="!isLoading && !error && recentLinks.length">
        <article class="recent-row" repeat.for="link of recentLinks" key="id">
          <div class="recent-main">
            <p class="recent-title">${link.title ?? 'Untitled link'}</p>
            <span class="recent-url font-mono">${link.original_url}</span>
          </div>
          <div class="button-row">
            <span class.bind="statusClass(link)">${link.is_active ? 'Active' : 'Inactive'}</span>
            <button class="btn-chip" type="button" click.trigger="copyLink(link.slug)">
              ${copiedSlug === link.slug ? 'Copied' : 'Copy'}
            </button>
            <a
              class="btn-chip"
              href.bind="shortUrl(link.slug)"
              target="_blank"
              rel="noreferrer"
            >
              Open
            </a>
          </div>
        </article>
      </div>

      <div class="empty-state" if.bind="!isLoading && !error && !recentLinks.length">
        <h3>No links yet</h3>
        <p>Create a short link and it will appear here.</p>
      </div>
    </section>
  </template>
</div>
